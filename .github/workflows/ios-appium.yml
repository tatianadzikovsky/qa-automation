name: iOS Appium Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e-ios:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and Simulators (for debugging)
        run: |
          xcodebuild -version
          echo "---- Device Types ----"
          xcrun simctl list devicetypes
          echo "---- Runtimes ----"
          xcrun simctl list runtimes

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium 2 + xcuitest driver
        run: |
          npm i -g appium@next
          appium driver install xcuitest
          appium --version
          appium driver list

      # ************ THIS REPLACES THE HARDCODED 'iOS 18.6' ************
      - name: Boot iOS Simulator (auto-detect runtime)
        shell: bash
        run: |
          set -euo pipefail

          # Pick the latest available iOS runtime identifier (e.g. com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          RUNTIME_ID=$(xcrun simctl list runtimes -j | /usr/bin/python3 - <<'PY'
import json, sys
data = json.load(sys.stdin)
ios = []
for r in data["runtimes"]:
    ident = r.get("identifier","")
    if ident.startswith("com.apple.CoreSimulator.SimRuntime.iOS"):
        # macOS runners sometimes expose 'isAvailable' or '(available)'
        if r.get("isAvailable") or r.get("availability") == "(available)":
            ios.append((r["version"], ident))
ios.sort(key=lambda x: tuple(map(int, x[0].split("."))))
print(ios[-1][1])
PY
)
          echo "Using runtime: $RUNTIME_ID"

          # Choose a known device type, falling back as needed.
          DEVICETYPE=$(
            xcrun simctl list devicetypes | awk -F'[()]' '
              /iPhone 16 Pro Max$/ {print $2; exit}
              /iPhone 16 Pro$/     {print $2; exit}
              /iPhone 16$/         {print $2; exit}
              /iPhone 15 Pro$/     {print $2; exit}
              /iPhone 15$/         {print $2; exit}
              /iPhone 14$/         {print $2; exit}
              /iPhone SE \(3rd generation\)$/ {print $2; exit}
            '
          )
          echo "Using device type: $DEVICETYPE"

          # Create & boot simulator
          UDID=$(xcrun simctl create "CI Phone" "$DEVICETYPE" "$RUNTIME_ID")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID"
          # Wait until fully booted
          xcrun simctl bootstatus "$UDID" -b

          # Cosmetic: set status bar, take a screenshot (non-fatal)
          xcrun simctl status_bar "$UDID" override --time "9:41" || true
          xcrun simctl io "$UDID" screenshot boot.png || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          # Ensure pytest-html is there if you use --html:
          pip install pytest-html

      - name: Start Appium server (background)
        run: |
          nohup appium > appium.log 2>&1 &

      - name: Run pytest (iOS)
        env:
          APPIUM_SERVER: http://127.0.0.1:4723
          IOS_DEVICE: CI Phone
        run: |
          # Keep arguments that match your local run; remove unsupported ones
          pytest -v -s tests_ios --maxfail=1 \
                 --html=report_ios.html --self-contained-html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            report_ios.html
            appium.log
            screenshots/**
