name: iOS Appium Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      IOS_DEVICE: "iPhone 14"
      IOS_VERSION: "16.4"   # You can adjust to a version GitHub runner supports
      APPIUM_SERVER: "http://127.0.0.1:4723/wd/hub"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Appium 3 + XCUITest driver
        run: |
          npm install -g appium@next
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "${IOS_DEVICE}" || true
          xcrun simctl bootstatus "${IOS_DEVICE}" -b

      - name: Start Appium server
        run: |
          nohup appium --base-path /wd/hub > appium.log 2>&1 &
          sleep 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Appium-Python-Client pytest pytest-html

      - name: Run pytest (iOS tests)
        run: pytest -v -s --html=report.html --self-contained-html tests/
