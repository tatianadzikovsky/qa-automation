name: iOS Appium Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and Simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium 2 + xcuitest driver
        run: |
          npm install -g appium@next
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl create "iPhone-16" "iPhone 16" "iOS" "18.6")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Appium server (background)
        run: |
          nohup appium --base-path /wd/hub --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          sleep 5

      - name: Run pytest (iOS)
        run: |
          pytest -v -s tests_ios \
            --timeout=60 \
            --reruns 1 \
            --reruns-delay 1 \
            --html=report_ios.html \
            --self-contained-html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            report_ios.html
            appium.log
            screenshots/
