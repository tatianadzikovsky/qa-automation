name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java for Android build tools & emulator runner
      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Node is needed for Appium (npm)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Python for pytest + appium python client
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
            path: ~/.cache/pip
            key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
            restore-keys: |
              pip-${{ runner.os }}-

      - name: Install dependencies (Python + Appium 3 + driver)
        run: |
          set -euxo pipefail

          # Python deps (pytest, appium-python-client, etc.)
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # safety net if requirements.txt is missing
            pip install pytest appium-python-client pytest-html
          fi

          # Install Appium 3 (fixes your CI error)
          npm install -g appium@3

          # Show versions for debug
          node -v
          npm -v
          appium -v
          python -V
          pip -V

          # Install Android driver for Appium
          appium driver install uiautomator2

      # Start Appium server in the background and capture logs
      - name: Start Appium
        run: |
          mkdir -p logs
          nohup appium --base-path /wd/hub > logs/appium.log 2>&1 &
          echo $! > appium.pid
          sleep 3
          pgrep -f appium || (echo "Appium failed to start" && exit 1)

      # Launch Android emulator and run tests inside it
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim
          script: |
            python -m pytest -v -s tests/test_ci_smoke.py \
              --html=report.html --self-contained-html

      # Always upload the report and logs, even if tests fail
      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            report.html
            screenshots/**
            logs/appium.log

      # Always stop Appium if it started
      - name: Stop Appium
        if: always()
        run: |
          if [ -f appium.pid ]; then
            kill -9 "$(cat appium.pid)" || true
          fi
