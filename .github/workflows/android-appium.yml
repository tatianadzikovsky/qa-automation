name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # 1) Checkout your repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Java for Android tools
      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) Python for pytest
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 4) Node.js to install Appium
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 5) Install Appium + Python deps
      - name: Install dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6) Boot an Android emulator and run tests inside it
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            mkdir -p logs screenshots

            # start Appium in background (no base path because your tests use http://127.0.0.1:4723)
            appium --log logs/appium.log &
            APPIUM_PID=$!

            # run only the mobile tests (adjust the -k filter if you want)
            pytest -v -s -k "appium or settings" --html=report.html --self-contained-html

            # stop Appium
            kill -9 $APPIUM_PID || true

      # 7) Upload report + screenshots no matter what
      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            report.html
            screenshots/**
            logs/appium.log

