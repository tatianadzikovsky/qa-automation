name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies (Python + Appium 3 via npx)
        shell: bash
        run: |
          set -euxo pipefail

          # Python deps
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest appium-python-client pytest-html
          fi

          # Show tool versions
          node -v
          npm -v
          python -V
          pip -V

          # Install Appium v3 **without** relying on global PATH
          # (use npx which resolves the requested version explicitly)
          npx -y appium@next --version

          # Install uiautomator2 driver against the same Appium v3
          npx -y appium@next driver install uiautomator2

      - name: Start Appium (v3) with npx
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs
          # Start Appium 3 explicitly via npx and keep it in background
          nohup npx -y appium@next --base-path /wd/hub > logs/appium.log 2>&1 &
          echo $! > appium.pid
          sleep 3
          pgrep -f "node .*appium" || (echo "Appium failed to start"; tail -n +1 logs/appium.log; exit 1)

      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim
          script: |
            python -m pytest -v -s tests/test_ci_smoke.py \
              --html=report.html --self-contained-html

      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            report.html
            screenshots/**
            logs/appium.log

      - name: Stop Appium
        if: always()
        run: |
          if [ -f appium.pid ]; then
            kill -9 "$(cat appium.pid)" || true
          fi
