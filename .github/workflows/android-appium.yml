name: Android Appium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Appium & drivers
        run: |
          npm i -g appium@latest wait-on
          appium -v
          appium driver install uiautomator2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare artifact folders
        run: mkdir -p screenshots logs

      # Boots emulator, then runs whatever script we provide
      - name: Launch emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb devices
            adb wait-for-device
            # speed up UI
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            # Start Appium in background and wait for the port
            appium --allow-cors --log logs/appium.log > logs/appium.console.log 2>&1 &
            echo $! > appium.pid
            wait-on tcp:4723 -t 60000

            # Run tests
            pytest -v -s tests/ --html=report.html --self-contained-html

      - name: Stop Appium
        if: always()
        run: |
          if [ -f appium.pid ]; then
            kill -9 "$(cat appium.pid)" || true
          fi

      - name: Upload artifacts (report, screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            report.html
            screenshots/**
            logs/**
