# pytest.ini
[pytest]
addopts = -v -s --html=report.html --self-contained-html --maxfail=1 --timeout=60 --reruns 1 --reruns-delay 1
testpaths = tests
markers =
    smoke: fast checks to validate basic functionality
    regression: broader coverage, slower tests
    wifi: tests related to Wi-Fi flows
    slow: long-running tests
filterwarnings =
    ignore::DeprecationWarning
